
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crispy Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="crispy">

  <!-- HERO -->
  <section class="hero">
    <h1>Crispy Cloud ☁️</h1>
    <p>Natural freeze-dried fruits, healthy & tasty snacks</p>

   
  </section>
  🛒 : <span id="cartCount">0</span>


  <!-- PRODUCTS -->
  <section class="products">

    <h2>Our Products</h2>

    <div class="card">
      <img src="https://images.pexels.com/photos/4499212/pexels-photo-4499212.jpeg"alt="Mango">
      <h3>Mango Slices</h3>
      <p>$5.99</p>
      <button onclick="addToCart('mango')">Add to Cart</button>
    </div>
    

    <div class="card">
      <img src="https://media.istockphoto.com/id/939430546/photo/freeze-dried-strawberries-on-a-slate-counter.jpg?s=1024x1024&w=is&k=20&c=JDBqrkuAlf7ROOGA_8keBMOjxjpba4OIApxmFnCRZI4=" alt="strawberries">
      <h3>Strawberry Chips</h3>
      <p>$6.99</p>
      <button onclick="addToCart('Strawberry Chips')">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/6823266/pexels-photo-6823266.jpeg" alt="apples" >
      <h3>Apple Bites</h3>
      <p>$4.99</p>
      <button onclick="addToCart('Apple Bites')">Add to Cart</button>
    </div>

    <div class="card">
      <img src="    https://images.pexels.com/photos/3471790/pexels-photo-3471790.jpeg" alt="orenges" >
      <h3>orenges slices</h3>
      <p>$2.99</p>
      <button onclick="addToCart('orenges slices')">Add to Cart</button>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
